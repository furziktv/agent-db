services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      MAX_WORKERS: ${MAX_WORKERS:-500}
      MAX_RPS: ${MAX_RPS:-100000}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-5242880}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
      MAX_GENERATOR_ROWS: ${MAX_GENERATOR_ROWS:-20000000}
    volumes:
      - agent_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 1h
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
volumes:
  agent_data:
